name: ios-unsigned-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dd/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project GermanListening.xcodeproj \
            -scheme GermanListening \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GermanListening.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/GermanListening.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E '(error:|warning:|ARCHIVE|\*\* )' || true

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/GermanListening.xcarchive/Products/Applications/GermanListening.app"
          test -d "$APP" || { tail -100 "$RUNNER_TEMP/build.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry GermanListening-unsigned.ipa Payload
          ls -lh GermanListening-unsigned.ipa
          EXE="$APP/GermanListening"
          echo "arch: $(lipo -archs "$EXE")"
          SIZE=$(stat -f%z "$EXE")
          echo "binary bytes: $SIZE"
          [ "$SIZE" -gt 20000000 ] || { echo "::error::binary is ${SIZE}B — libmpv did not link"; exit 1; }
          RESOLVED="GermanListening.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ -f "$RESOLVED" ]; then cp "$RESOLVED" "$RUNNER_TEMP/"; echo "--- Package.resolved ---"; cat "$RESOLVED"; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-diagnostics
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/GermanListening.xcresult
            ${{ runner.temp }}/Package.resolved
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GermanListening-ipa
          path: ${{ runner.temp }}/GermanListening-unsigned.ipa
          if-no-files-found: error
