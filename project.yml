name: GermanListening
options:
  bundleIdPrefix: xyz.1122275
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 0.41.0

targets:
  GermanListening:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: Support/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.1122275.germanlistening
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
