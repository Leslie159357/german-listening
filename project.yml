name: GermanListening
options:
  bundleIdPrefix: xyz.1122275
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 0.41.0

targets:
  GermanListening:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 精听
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, public.audiovisual-content]
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, public.mpeg-4-audio]
          - CFBundleTypeName: Subtitle
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text, public.text]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.1122275.germanlistening
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
