name: GermanListening
options:
  bundleIdPrefix: xyz.1122275
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 0.41.0

targets:
  GermanListening:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 精听
        CFBundleShortVersionString: "0.7.0"
        CFBundleVersion: "7"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: 跟读练习需要录音，用于回放对比自己的发音。
        NSSpeechRecognitionUsageDescription: 跟读评分需要识别你的发音并给出客观反馈。
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: xyz.1122275.srt
            UTTypeDescription: SubRip 字幕
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [srt]
              public.mime-type: application/x-subrip
          - UTTypeIdentifier: xyz.1122275.vtt
            UTTypeDescription: WebVTT 字幕
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [vtt]
              public.mime-type: text/vtt
          - UTTypeIdentifier: xyz.1122275.ass
            UTTypeDescription: ASS/SSA 字幕
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [ass, ssa]
          - UTTypeIdentifier: xyz.1122275.mkv
            UTTypeDescription: Matroska 视频
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv, webm]
        CFBundleDocumentTypes:
          - CFBundleTypeName: 视频
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, xyz.1122275.mkv]
          - CFBundleTypeName: 音频
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3]
          - CFBundleTypeName: 字幕
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [xyz.1122275.srt, xyz.1122275.vtt, xyz.1122275.ass]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.1122275.germanlistening
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
